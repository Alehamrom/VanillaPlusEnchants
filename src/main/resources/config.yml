# ==============================================================
#                 VanillaPlusEnchants Configuration
# ==============================================================

prefix: "<dark_purple>[<light_purple>Vanilla+<dark_purple>]</light_purple></dark_purple> "

messages:
  no_permission: "<red>У вас нет прав для выполнения этой команды!</red>"
  player_not_found: "<red>Игрок <yellow>{player}</yellow> не найден!</red>"
  invalid_enchant: "<red>Неизвестное зачарование: <yellow>{enchant}</yellow>!</red>"
  invalid_level: "<red>Уровень должен быть от 1 до {max}!</red>"
  invalid_target: "<red>Это зачарование нельзя наложить на данный предмет!</red>"
  incompatible: "<red>Это зачарование несовместимо с зачарованиями на предмете: <yellow>{incompatible}</yellow>!</red>"
  give_success: "<green>Зачарование <yellow>{enchant} {level}</yellow> успешно наложено на предмет игрока <yellow>{player}</yellow>!</green>"
  give_no_item: "<red>Игрок должен держать подходящий предмет в руке!</red>"
  book_success: "<green>Книга зачарований <yellow>{enchant} {level}</yellow> выдана игроку <yellow>{player}</yellow>!</green>"
  reload_success: "<green>Конфигурация успешно перезагружена!</green>"
  list_header: "<dark_purple>=== <light_purple>Список зачарований Vanilla+<dark_purple> ===</dark_purple>"
  list_item: "<yellow>• <light_purple>{name}</light_purple> <gray>(ID: {id}, Макс. ур: {max_level})</gray></yellow><newline>  <gray>Применяется к: <white>{targets}</white></gray><newline>  <dark_gray>{description}</dark_gray>"

lore:
  format_single: "<!italic><gray>{name}</gray>"
  format_leveled: "<!italic><gray>{name} {roman}</gray>"

enchants:
  smelting_touch:
    enabled: true
    name: "Обжиг"
    description: "Автоматически переплавляет добытые руды, песок и глину."
    durability_cost_unsmeltable: 1
    durability_cost_smeltable: 4
    play_particles: true
    play_sound: true
    smeltable_blocks:
      RAW_IRON: IRON_INGOT
      IRON_ORE: IRON_INGOT
      DEEPSLATE_IRON_ORE: IRON_INGOT
      RAW_IRON_BLOCK: IRON_BLOCK
      RAW_COPPER: COPPER_INGOT
      COPPER_ORE: COPPER_INGOT
      DEEPSLATE_COPPER_ORE: COPPER_INGOT
      RAW_COPPER_BLOCK: COPPER_BLOCK
      RAW_GOLD: GOLD_INGOT
      GOLD_ORE: GOLD_INGOT
      DEEPSLATE_GOLD_ORE: GOLD_INGOT
      NETHER_GOLD_ORE: GOLD_INGOT
      RAW_GOLD_BLOCK: GOLD_BLOCK
      SAND: GLASS
      RED_SAND: GLASS
      CLAY: BRICK
      COBBLESTONE: STONE
      STONE: SMOOTH_STONE
      COBBLED_DEEPSLATE: DEEPSLATE
      NETHERRACK: NETHER_BRICK
      WET_SPONGE: SPONGE
      CACTUS: GREEN_DYE
    blacklist:
      - "ANCIENT_DEBRIS"

  static_shock:
    enabled: true
    name: "Цепной разряд"
    description: "При критической атаке в прыжке выпускает разряд по 2-3 врагам."
    cooldown_seconds: 5.0
    chain_radius: 4.0
    min_targets: 2
    max_targets: 3
    damage:
      1: 3.0   # 1.5 hearts
      2: 4.5   # 2.25 hearts
      3: 6.0   # 3.0 hearts

  soul_siphon:
    enabled: true
    name: "Жатва душ"
    description: "Восстанавливает здоровье при убийстве мобов с запасом здоровья более 8 сердец (16 HP)."
    min_target_max_health: 16.0
    heal:
      1: 1.0   # 0.5 heart
      2: 2.0   # 1.0 heart
      3: 3.0   # 1.5 hearts

  ricochet:
    enabled: true
    name: "Рикошет"
    description: "Стрелы с шансом 33% рикошетят в ближайшего второго врага с 50% урона."
    chance_percent: 33.0
    damage_multiplier: 0.5
    radius:
      1: 5.0
      2: 10.0
      3: 15.0
      4: 20.0

  silent_step:
    enabled: true
    name: "Мягкая поступь"
    description: "Подавляет вибрации шагов для скалк-сенсоров и Вардена, снижая скорость бега на 30%."
    speed_reduction_percent: 30.0
    show_debuff_in_lore: true
    debuff_lore: "<!italic><red>-30% Скорость бега</red>"

anvil:
  base_cost: 2
  level_cost_multiplier: 1

grindstone:
  exp_per_level: 10
